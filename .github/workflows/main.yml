name: Build Android APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake ccache
          pip install --upgrade buildozer "cython<3" virtualenv
      - name: Build APK
        run: |
          (yes || true) | buildozer android debug > build.log 2>&1 || {
            echo "=== BUILD FAILED. 60 LINES BEFORE THE ERROR ==="
            grep -n -B60 "Command failed" build.log | head -n 120
            exit 1
          }
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: AbixNinja-APK
          path: bin/*.apk
